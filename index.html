<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>得点板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/display.css">
</head>
<body>
  <main class="board" id="board" aria-label="バレーボール得点板">
    <header class="top">
      <div class="top-slot top-tournament">
        <p class="top-text" id="tournamentName"></p>
      </div>
      <div class="top-slot top-round">
        <p class="top-text" id="roundName"></p>
      </div>
      <div class="top-slot top-end" aria-hidden="true"></div>
    </header>
    <div class="main">
      <div class="name-slot slot-a">
        <h1 class="name" id="nameA">チームA</h1>
      </div>
      <div class="serve" id="serveA" role="img" aria-label="チームAのサーブ権なし"></div>
      <div class="score" id="scoreA">0</div>
      <div class="mid" id="mid">
        <div class="history" id="history"></div>
        <p class="set-label" id="setLabel">SET 1</p>
        <div class="lead" id="lead"></div>
      </div>
      <div class="score" id="scoreB">0</div>
      <div class="serve" id="serveB" role="img" aria-label="チームBのサーブ権なし"></div>
      <div class="name-slot slot-b">
        <h1 class="name" id="nameB">チームB</h1>
      </div>
    </div>
  </main>
  <script type="module" src="js/display.js"></script>
</body>
</html>
